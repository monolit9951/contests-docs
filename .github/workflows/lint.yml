# Required PR gate for the content fleet. Hard checks: anti-doorway linter + docs:build (dead links,
# valid frontmatter). Spell is advisory. Add `lint` as a required status check in branch protection
# on develop + release (see .github/BRANCH_PROTECTION.md).
name: lint

on:
  pull_request:
    branches: [develop, release]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0                                   # linter diffs the PR against its base
          ref: ${{ github.event.pull_request.head.sha }}   # the PR head, not the synthetic merge ref
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci
      - name: audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: unit tests (analytics beacon + linter self-check)
        run: npm test
      - name: anti-doorway lint (redirect / provenance / path+uniqueness / cap / near-dup)
        run: node --experimental-strip-types --no-warnings scripts/anti_doorway_lint.mjs --corpus docs --base ${{ github.event.pull_request.base.sha }}
      - name: build (dead links + frontmatter)
        run: npm run docs:build
        env:
          DOCS_ENV: dev
      - name: spell (advisory)
        run: bash .github/scripts/spell-diff.sh || true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
