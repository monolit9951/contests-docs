# Required PR gate for the content fleet. Hard checks: anti-doorway linter + docs:build (dead links,
# valid frontmatter). Spell is advisory. Add `lint` as a required status check in branch protection
# on develop + release (see .github/BRANCH_PROTECTION.md).
name: lint

on:
  pull_request:
    branches: [develop, release]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_TRUTH_BACKEND_REPO: ${{ github.workspace }}/.product-truth-sources/backend
      PRODUCT_TRUTH_PACK_REPO: ${{ github.workspace }}/.product-truth-sources/truth-pack
      PRODUCT_TRUTH_REQUIRE_LOCAL_SOURCES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                                   # linter diffs the PR against its base
          ref: ${{ github.event.pull_request.head.sha }}   # the PR head, not the synthetic merge ref
      - name: Resolve reviewed product-truth revisions
        id: product_truth_refs
        run: node scripts/export-product-truth-source-refs.mjs
      # These are private repositories with distinct read-only deploy keys.
      # The reviewed SHAs come only from the versioned product-truth snapshot.
      - name: Checkout reviewed backend truth source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: monolit9951/Contests
          ref: ${{ steps.product_truth_refs.outputs.backend_sha }}
          path: .product-truth-sources/backend
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/main/resources/application.properties
            docs/MANUAL_PAYOUTS_ADMIN.md
            src/main/java/com/neptune/core/contest/domain/service/ContestLifecycleManager.java
            src/main/java/com/neptune/core/withdrawal/service/WithdrawalService.java
            src/main/java/com/neptune/core/winners/domain/service/RandomWinnerSelector.java
          ssh-key: ${{ secrets.PRODUCT_TRUTH_BACKEND_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false
      - name: Checkout reviewed truth-pack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: monolit9951/darebay-seo-fleet
          ref: ${{ steps.product_truth_refs.outputs.truth_pack_sha }}
          path: .product-truth-sources/truth-pack
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: data/product-facts.md
          ssh-key: ${{ secrets.PRODUCT_TRUTH_PACK_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci
      - name: audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: unit tests (analytics beacon + linter self-check)
        run: npm test
      - name: anti-doorway lint (redirect / provenance / path+uniqueness / cap / near-dup)
        run: node --experimental-strip-types --no-warnings scripts/anti_doorway_lint.mjs --corpus docs --base ${{ github.event.pull_request.base.sha }}
      - name: build (dead links + frontmatter)
        run: npm run docs:build
        env:
          DOCS_ENV: dev
      - name: spell (advisory)
        run: bash .github/scripts/spell-diff.sh || true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
