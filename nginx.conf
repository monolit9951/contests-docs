server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # Redirect /docs → /docs/ so index resolution works
    location = /docs {
        return 301 /docs/;
    }

    # Long-cache hashed assets (VitePress puts them under /docs/assets/*)
    location ^~ /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Common static files with long cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Docs site. VitePress with cleanUrls emits `foo.html` but links to `/foo`.
    # Try the literal path, then a directory (for /docs/ and /docs/ru/), then
    # the .html fallback for clean URLs, then 404.
    location /docs/ {
        index index.html;
        try_files $uri $uri/ $uri.html =404;

        # HTML entries themselves should not be cached by intermediaries.
        # Security headers must be repeated here: nginx's `add_header`
        # inheritance rule drops parent-level headers whenever a nested
        # location adds any.
        location ~* \.html$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # Bare container health probe — not exposed through the public domain
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Anything outside /docs/ or /health — behave like the path doesn't exist.
    # (The public host nginx only routes /docs/* to this container.)
    location = / {
        return 404;
    }
}
