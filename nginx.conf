server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Emit relative Location headers. TLS terminates at the host nginx and this container is
    # reached over plain http, so nginx would otherwise build every redirect as
    # `http://darebay.com/...` — a protocol downgrade that the host then has to bounce back to
    # https, turning one redirect into three hops. Relative Location keeps the client's scheme.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # ── Retired addresses ────────────────────────────────────────────────────────────────
    #
    # The whole `/docs/ru/<zone>/<slug>` layout was retired by the 2026-08 URL migration:
    # content now answers on root-level topic hubs, and the host nginx routes those prefixes
    # here. Every old address gets ONE permanent hop onto its current one.
    #
    # GENERATED from docs/.vitepress/registry.ts — never edit redirects.conf by hand:
    #   node --experimental-strip-types scripts/gen-nginx-redirects.mjs
    #
    # It also absorbs the eight rules added on 2026-07-25 when the EN tree was removed. Those
    # pointed at `/docs/ru/...`, which this migration moves again — keeping them as a separate
    # layer would have made `EN → RU-old → new` a two- or three-hop trip. They are regenerated
    # onto the FINAL target instead.
    include /etc/nginx/snippets/redirects.conf;

    # Canonical public form is clean: no `.html`, and hub indexes end in `/`.
    # Exact retired-address rules above win before these regexes, so migrations
    # still jump directly to their final target.
    location ~ "^(?<clean_index>.+)/index\.html$" {
        # The index module internally resolves `/hub/` to `/hub/index.html`.
        # Redirect only when index.html was present in the CLIENT request;
        # otherwise this location would send the canonical hub to itself.
        if ($request_uri ~ "/index\.html(?:\?.*)?$") {
            return 301 $clean_index/$is_args$args;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^(.+)\.html$ {
        return 301 $1$is_args$args;
    }

    # ── Assets ───────────────────────────────────────────────────────────────────────────
    #
    # `content-assets` and NOT the VitePress default `assets`: with base '/', this container
    # and the SPA both answer at the domain root, and two different `/assets/` prefixes would
    # be indistinguishable to the host nginx. See the note on `assetsDir` in config.ts.
    # Only filenames carrying Vite's 8-character content hash are immutable.
    # The optional `.lean` segment is part of VitePress page chunks; the hash
    # still precedes it. Stable public names (logo.svg, favicon.svg and our
    # manually versionless fonts) must be able to change without a one-year
    # stale cache.
    location ~ "^/content-assets/(?:.*/)?[^/]+\.[A-Za-z0-9_-]{8}(?:\.lean)?\.(?:js|mjs|css|woff2?|png|jpe?g|svg|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /content-assets/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Public URL topology for other DareBay surfaces. It is generated as an
    # exact copy of docs/content-pages.json and must be revalidated, not cached
    # indefinitely: localized slugs are allowed to move between releases.
    location = /.well-known/darebay-content-pages.json {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /.well-known/darebay-content-release.txt {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sitemap-content.xml {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    location = /llms.txt {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    # `internal` prevents these implementation URLs becoming indexable pages of
    # their own. error_page preserves the original 404 status.
    location = /404.ru.html {
        internal;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /404.uk.html {
        internal;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /404.en.html {
        internal;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-store" always;
    }

    # ── Content ──────────────────────────────────────────────────────────────────────────
    #
    # VitePress with cleanUrls emits `foo.html` but links to `/foo`. Try the literal path,
    # then a directory (for hub indexes), then the .html fallback, then 404.
    #
    # This container only ever RECEIVES the prefixes the host routes to it — the hub segments
    # plus /sitemap-content.xml and /llms.txt — so a bare `location /` here cannot swallow
    # anything the application owns.
    location /ua/ {
        index index.html;
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.uk.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /en/ {
        index index.html;
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.en.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        index index.html;
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.ru.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Bare container health probe — not exposed through the public domain.
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
