server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Emit relative Location headers. TLS terminates at the host nginx and this container is
    # reached over plain http, so nginx would otherwise build every redirect as
    # `http://darebay.com/...` — a protocol downgrade that the host then has to bounce back to
    # https, turning one redirect into three hops. Relative Location keeps the client's scheme.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # ── EN tree removed 2026-07-25 (seo-fleet DECISIONS B5). The site is RU-only, but the
    # English pages held the SHORT urls (/docs/, /docs/faq/…) while RU sat a level deeper —
    # so Google indexed the English ones and served English sitelinks under a Russian brand
    # result. These 301s hand the accumulated index over to the RU pages instead of 404ing it.
    # nginx precedence: `=` exact → `^~` prefix → regex in file order → longest prefix, so the
    # `^~ /docs/assets/` block below is untouched by the regex redirect.
    # /docs/ itself stays a real page — the RU manifesto moved onto it, so the url Google
    # already shows as a sitelink keeps its 200 and just switches language.
    location = /docs { return 301 /docs/; }
    # ...which means the manifesto's old RU url is the one that now redirects.
    location = /docs/ru/           { return 301 /docs/; }
    location = /docs/ru/index.html { return 301 /docs/; }
    # No RU counterpart under the same slug — the fleet replaced these two pre-fleet pages.
    location = /docs/faq/fees          { return 301 /docs/ru/faq/kakaya-komissiya; }
    location = /docs/faq/fees.html     { return 301 /docs/ru/faq/kakaya-komissiya; }
    location = /docs/faq/withdraw      { return 301 /docs/ru/faq/darebay-vyvod-deneg; }
    location = /docs/faq/withdraw.html { return 301 /docs/ru/faq/darebay-vyvod-deneg; }
    # Everything else in the three EN sections maps 1:1 onto the RU slug — see the nested
    # rule inside `location /docs/` below (it has to live there to also catch `.html`).

    # Long-cache hashed assets (VitePress puts them under /docs/assets/*)
    location ^~ /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Common static files with long cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Docs site. VitePress with cleanUrls emits `foo.html` but links to `/foo`.
    # Try the literal path, then a directory (for /docs/ and /docs/ru/), then
    # the .html fallback for clean URLs, then 404.
    location /docs/ {
        index index.html;
        try_files $uri $uri/ $uri.html =404;

        # Without this a broken link lands on nginx's stock "404 Not Found" — English, and it
        # prints the nginx version. VitePress already builds a themed 404; serve that instead.
        error_page 404 /docs/404.html;

        # EN → RU (see the note at the top of this file). This lives INSIDE `/docs/` and
        # BEFORE the `.html` block on purpose: nginx descends into the nested locations of
        # the matched prefix before it ever looks at outer regex locations, so a nested
        # `\.html$` would otherwise swallow /docs/faq/crypto.html and leave it 404-ing.
        # Nested regexes are tried in file order, so this one has to come first.
        location ~ ^/docs/(getting-started|faq|legal)(/.*)?$ {
            return 301 /docs/ru/$1$2;
        }

        # HTML entries themselves should not be cached by intermediaries.
        # Security headers must be repeated here: nginx's `add_header`
        # inheritance rule drops parent-level headers whenever a nested
        # location adds any.
        location ~* \.html$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # Bare container health probe — not exposed through the public domain
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Anything outside /docs/ or /health — behave like the path doesn't exist.
    # (The public host nginx only routes /docs/* to this container.)
    location = / {
        return 404;
    }
}
